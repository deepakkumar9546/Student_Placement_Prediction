<!DOCTYPE html>
<html>
<head>
    <title>Student Placement Predictor</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            width: 420px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: #eef6ff;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Placement Predictor</h1>

    <form action="/predict" method="POST">

        <label>CGPA</label>
        <input
            type="number"
            name="cgpa"
            step="0.1"
            min="0"
            max="10"
            required
        >

        <label>Number of Internships</label>
        <input
            type="number"
            name="internships"
            min="0"
            required
        >

        <label>Number of Projects</label>
        <input
            type="number"
            name="projects"
            min="0"
            required
        >

        <label>Aptitude Score</label>
        <input
            type="number"
            name="aptitude_score"
            min="0"
            max="100"
            required
        >

        <label>Communication Score</label>
        <input
            type="number"
            name="communication_score"
            min="0"
            max="100"
            required
        >

        <button type="submit">
            Predict Placement
        </button>

    </form>

    {% if prediction %}
        <div class="result">
            {{ prediction }}
        </div>
    {% endif %}

</div>

</body>
</html>
