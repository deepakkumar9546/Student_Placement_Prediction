{% extends "base.html" %}

{% block content %}

<div class="auth card">

    <h1>Login</h1>

    <form method="POST">

        <label>Email</label>
        <input type="email" name="email" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <button type="submit">
            Login
        </button>

    </form>

    <p>
        Don't have an account?
        <a href="{{ url_for('register') }}">Register</a>
    </p>

</div>

{% endblock %}
