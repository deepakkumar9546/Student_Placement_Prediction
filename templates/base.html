<!DOCTYPE html>
<html>
<head>

    <title>Placement Predictor</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        nav {
            background: #111827;
            color: white;
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            margin: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 22px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .stat {
            text-align: center;
        }

        .stat h1 {
            color: #2563eb;
            font-size: 38px;
            margin: 10px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 18px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
        }

        button,
        .btn {
            background: #2563eb;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        button:hover,
        .btn:hover {
            background: #1d4ed8;
        }

        .result {
            padding: 18px;
            background: #e0f2fe;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #f3f4f6;
        }

        .auth {
            max-width: 420px;
            margin: 80px auto;
        }

        .auth h1 {
            text-align: center;
        }

        .message {
            background: #fff3cd;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 15px;
        }

    </style>

</head>

<body>

{% if session.get("user_id") %}

<nav>

    <h2>Placement Predictor</h2>

    <div>
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('predict') }}">Predict</a>
        <a href="{{ url_for('history') }}">History</a>
        <a href="{{ url_for('profile') }}">Profile</a>
        <a href="{{ url_for('about') }}">About</a>
        <a href="{{ url_for('logout') }}">Logout</a>
    </div>

</nav>

{% endif %}


{% with messages = get_flashed_messages() %}

    {% if messages %}

        <div class="container">

            {% for message in messages %}

                <div class="message">
                    {{ message }}
                </div>

            {% endfor %}

        </div>

    {% endif %}

{% endwith %}


{% block content %}

{% endblock %}

</body>
</html>
